<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Walter Solutions</title>
    <style>
        body { font-family: Arial; background: #0d1117; color: white; padding: 20px; }
        .alerta { background: #1e1e2f; padding: 10px; margin: 10px 0; border-left: 4px solid #ff6b6b; }
        .titulo { color: #58a6ff; }
    </style>
</head>
<body>
    <h1 class="titulo">🛡️ Mini-SOC - Walter Solutions</h1>
    <h2>📋 Alertas detectadas</h2>
    <div id="alertas"></div>

    <script>
        fetch('alertas.log')
            .then(response => response.text())
            .then(data => {
                const lineas = data.split('\n').filter(line => line.trim() !== '');
                const container = document.getElementById('alertas');
                lineas.forEach(linea => {
                    const div = document.createElement('div');
                    div.className = 'alerta';
                    div.textContent = linea;
                    container.appendChild(div);
                });
            });
    </script>
</body>
</html>
